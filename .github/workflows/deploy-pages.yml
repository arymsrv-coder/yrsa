name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a test link can be refreshed from the Actions tab without a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run supersedes a waiting one, but never cancels a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Pages serves this repo from /yrsaclicks/, so every URL the site
          # writes needs that prefix. Read by next.config.ts and app/lib/asset.ts.
          NEXT_PUBLIC_BASE_PATH: /yrsaclicks

      # Without this, Pages runs the output through Jekyll, which drops
      # `_next/` — every script and stylesheet 404s.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
