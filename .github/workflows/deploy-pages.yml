name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a test link can be refreshed from the Actions tab without a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run supersedes a waiting one, but never cancels a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `node-version` is the Node this project builds on, and is not what the
      # runner's Node 20 notice was about — that one is the runtime the actions
      # themselves declare, which is why the pinned versions moved and this
      # number did not.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Pages serves a project repo from /<repo>/, so every URL the site
          # writes needs that prefix. Read by next.config.ts and app/lib/asset.ts.
          #
          # Taken from the repository rather than written down. It was
          # hardcoded to /yrsaclicks, which was correct for exactly one
          # repository — pushed to another it would have built a site whose
          # every script, stylesheet and photograph pointed at a path the host
          # does not serve. Nothing would have failed loudly; the deploy would
          # have gone green and the page would have come up blank.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

          # Refreshes the channel snapshot as part of the deploy, so the
          # landing page's channel rows pick up new uploads without a commit. Read by the `prebuild`
          # script, never by the browser — the key stays on the runner and
          # only the fetched JSON and thumbnails reach the artifact.
          #
          # Optional. An unset secret is an empty string, which the script
          # treats exactly as no key: it logs a line, leaves the committed
          # snapshot alone and exits zero, so a fork with no secret still
          # deploys.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # Without this, Pages runs the output through Jekyll, which drops
      # `_next/` — every script and stylesheet 404s.
      - run: touch out/.nojekyll

      # Pages has to already exist on the repository for this step to find it.
      # A repository that has never had it fails here with "Get Pages site
      # failed / Not Found", and the `enablement: true` option that is supposed
      # to fix that cannot: creating a Pages site is beyond what the default
      # `GITHUB_TOKEN` may do, so it swaps the error for "Resource not
      # accessible by integration" and fails just the same.
      #
      # So the first deploy to a new repository needs one manual step —
      # Settings -> Pages -> Source: GitHub Actions, or
      # `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`.
      - uses: actions/configure-pages@v6

      # Left on v3, with v5 available, because this pair has to match the
      # `deploy-pages` below and the two of them are the only steps here that
      # were not named in the Node 20 notice. Moving them is a change to how the
      # artifact is uploaded rather than a runtime bump, so it wants its own run
      # to prove rather than riding along with one.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
